<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/tgf-sp-demo/">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TGF Spare Parts Procurement (pre-production demo)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tgf SP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tgf SP</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f4f4; }
    #tgf-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #tgf-loading div { width: 44px; height: 44px; border: 4px solid #d6d6d6; border-top-color: #111;
      border-radius: 50%; animation: tgf-spin 0.9s linear infinite; }
    @keyframes tgf-spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <div id="tgf-loading"><div></div></div>
  <script>
    // PDF previews: pdf.js from this site (pdfjs/, version 3.2.146 = the printing package's default), not unpkg.com.
    window.dartPdfJsBaseUrl = "pdfjs/";
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('tgf-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
